[project]
name = "devstuff"
version = "1.18.0"
description = "Development environment setup CLI for Linux"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Sawyer", email = "sawyerksu@gmail.com" }
]
keywords = ["cli", "devtools", "setup", "linux", "developer"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Installation/Setup",
    "Topic :: Utilities",
]
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
    "rich>=13.0",
    "questionary>=2.0",
]

[project.scripts]
devstuff = "dev_setup.__main__:main"
dev-setup = "dev_setup.__main__:main"

[project.urls]
Repository = "https://github.com/thesawdawg/dev-setup-py"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dev_setup"]

[dependency-groups]
dev = [
    "commitizen>=3.0",
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "SIM105",  # try/except/pass is intentional around subprocess probes
]
# Commitizen — generated by `devstuff configure commitizen`
[tool.commitizen]
name = 'cz_customize'
version_provider = 'uv'
version_scheme = 'pep440'
tag_format = 'v$version'
update_changelog_on_bump = true
changelog_file = 'CHANGELOG.md'
changelog_incremental = true
changelog_merge_prerelease = true
major_version_zero = false
annotated_tag = true
gpg_sign = false
allow_abort = false
use_shortcuts = true

# Commit message shape: the questions `cz commit` asks and the message it
# builds out of the answers.
[tool.commitizen.customize]
message_template = "{{change_type}}{% if scope %}({{scope}}){% endif %}{% if breaking %}!{% endif %}: {{subject}}{% if body %}\n\n{{body}}{% endif %}{% if breaking and footer %}\n\nBREAKING CHANGE: {{footer}}{% elif footer %}\n\n{{footer}}{% endif %}"
example = "feat(api): add rate limiting to the search endpoint\n\nrequests over 100/min now get a 429 instead of timing out"
schema = "<type>(<scope>): <subject>\n<BLANK LINE>\n<body>\n<BLANK LINE>\n(BREAKING CHANGE: )<footer>"
schema_pattern = '(?s)(feat|fix|refactor|perf|docs|style|test|build|ci|chore|deps|bump)(\(\S+\))?!?: ([^\n\r]+)((\n\n.*)|(\s*))?$'
info = "Commit types in this project:\n\n  feat       A new feature (MINOR)\n  fix        A bug fix (PATCH)\n  refactor   A code change that neither fixes a bug nor adds a feature (PATCH)\n  perf       A code change that improves performance (PATCH)\n  docs       Documentation only changes (no release)\n  style      Formatting, white-space, missing semi-colons — no behaviour change (no release)\n  test       Adding missing tests or correcting existing ones (no release)\n  build      Build system or dependency changes (pip, docker, npm) (no release)\n  ci         CI configuration files and scripts (no release)\n  chore      Maintenance work with no user-visible effect (no release)\n  deps       Dependency upgrades (PATCH)\n\nAdd ! after the type (feat!: ...) or a 'BREAKING CHANGE:' footer for a breaking change."

# Which commits `cz bump` reads, and how it parses them for the changelog.
bump_pattern = '^((BREAKING[\-\ ]CHANGE|feat|fix|refactor|perf|docs|style|test|build|ci|chore|deps)(\(.+\))?!?):'
changelog_pattern = '^((BREAKING[\-\ ]CHANGE|feat|fix|refactor|perf|docs|style|test|build|ci|chore|deps)(\(.+\))?!?):'
commit_parser = '^((?P<change_type>BREAKING CHANGE|feat|fix|refactor|perf|deps)(?:\((?P<scope>[^()\r\n]*)\)|\()?(?P<breaking>!)?|\w+!):\s(?P<message>.*)?'
change_type_order = ['BREAKING CHANGE', 'Features', 'Bug Fixes', 'Refactors', 'Performance', 'Dependencies']

# Prefix -> version increment. Order matters: commitizen stops at the first
# key that matches, so the two breaking-change rules have to lead.
[tool.commitizen.customize.bump_map]
'^.+!$' = 'MAJOR'
'^BREAKING[\-\ ]CHANGE' = 'MAJOR'
'^feat' = 'MINOR'
'^fix' = 'PATCH'
'^refactor' = 'PATCH'
'^perf' = 'PATCH'
'^deps' = 'PATCH'

# The same map for `major_version_zero`, where a breaking change is only
# allowed to move the minor: 0.x is not promising anything yet.
[tool.commitizen.customize.bump_map_major_version_zero]
'^.+!$' = 'MINOR'
'^BREAKING[\-\ ]CHANGE' = 'MINOR'
'^feat' = 'MINOR'
'^fix' = 'PATCH'
'^refactor' = 'PATCH'
'^perf' = 'PATCH'
'^deps' = 'PATCH'

# Commit type -> changelog heading. Types left out never appear in it.
[tool.commitizen.customize.change_type_map]
'feat' = 'Features'
'fix' = 'Bug Fixes'
'refactor' = 'Refactors'
'perf' = 'Performance'
'deps' = 'Dependencies'

[[tool.commitizen.customize.questions]]
type = 'list'
name = 'change_type'
message = 'Select the type of change you are committing'
choices = [
  { value = 'feat', name = 'feat: A new feature', key = 'f' },
  { value = 'fix', name = 'fix: A bug fix', key = 'x' },
  { value = 'refactor', name = 'refactor: A code change that neither fixes a bug nor adds a feature', key = 'r' },
  { value = 'perf', name = 'perf: A code change that improves performance', key = 'p' },
  { value = 'docs', name = 'docs: Documentation only changes', key = 'd' },
  { value = 'style', name = 'style: Formatting, white-space, missing semi-colons — no behaviour change', key = 's' },
  { value = 'test', name = 'test: Adding missing tests or correcting existing ones', key = 't' },
  { value = 'build', name = 'build: Build system or dependency changes (pip, docker, npm)', key = 'b' },
  { value = 'ci', name = 'ci: CI configuration files and scripts', key = 'c' },
  { value = 'chore', name = 'chore: Maintenance work with no user-visible effect', key = 'z' },
  { value = 'deps', name = 'deps: Dependency upgrades', key = 'e' },
]

[[tool.commitizen.customize.questions]]
type = 'input'
name = 'scope'
message = 'Scope — the part of the codebase (press enter to skip):'

[[tool.commitizen.customize.questions]]
type = 'input'
name = 'subject'
message = 'Short, imperative summary (lower case, no full stop):'

[[tool.commitizen.customize.questions]]
type = 'input'
name = 'body'
message = 'Longer description (press enter to skip):'
multiline = true

[[tool.commitizen.customize.questions]]
type = 'confirm'
name = 'breaking'
message = 'Is this a breaking change?'
default = false

[[tool.commitizen.customize.questions]]
type = 'input'
name = 'footer'
message = 'Footer — breaking-change details, issue references (press enter to skip):'

[tool.pytest.ini_options]
addopts = "-m 'not integration'"
markers = [
    "integration: real-system tests that install software (require sudo and network access)",
]

version: 1
tools:
  ansible:
    name: Ansible
    description: Automation engine for configuration management and app deployment
    category: tools
    type: uvx
    check_cmd: ansible
    pip_name: ansible
    # The `ansible` distribution is the collections bundle and declares no console
    # scripts of its own — `ansible`, `ansible-playbook`, `ansible-vault` and the rest
    # are entry points of its ansible-core dependency, and `uv tool install` only
    # exposes the requested package's scripts. Without this, the install "succeeds"
    # and puts a single unusable `ansible-community` on PATH. Do not swap this for
    # pip_name: ansible-core — that drops the bundled collections.
    uv_executables_from:
      - ansible-core
    help_cmd: ansible --help
    docs_url: https://docs.ansible.com/

  ansible-vault:
    name: Ansible Vault
    description: Encrypt and manage secrets within Ansible projects (bundled with Ansible)
    category: tools
    type: uvx
    check_cmd: ansible-vault
    pip_name: ansible
    uv_executables_from:
      - ansible-core
    help_cmd: ansible-vault --help
    docs_url: https://docs.ansible.com/ansible/latest/vault_guide/index.html
    requires:
      - ansible
    remove_script: |
      set -euo pipefail
      echo "ansible-vault is bundled with the ansible package — run 'devstuff remove ansible' to uninstall it."

  aws:
    name: AWS CLI
    description: Amazon Web Services command line interface (v2)
    category: tools
    type: bash
    check_cmd: aws
    help_cmd: aws help
    docs_url: https://docs.aws.amazon.com/cli/latest/userguide/
    # The v2 installer ships a glibc bundle and unpacks it into /usr/local via sudo.
    requires_traits:
      - glibc
      - fhs
      - sudo
    platforms:
      termux:
        # Termux builds AWS CLI *v2* from source as the `awscli` package — same major
        # version as the bundle above, so this is the real tool, not the v1 fallback.
        requires_traits: []
        type: system
        packages: awscli
        remove_script: ""
    install_script: |
      set -euo pipefail
      arch="$(uname -m)"
      if [ "$arch" = "aarch64" ]; then
        aws_arch="aarch64"
      else
        aws_arch="x86_64"
      fi
      tmpdir="$(mktemp -d)"
      trap 'rm -rf "$tmpdir"' EXIT
      curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-${aws_arch}.zip" -o "$tmpdir/awscliv2.zip"
      python3 - "$tmpdir/awscliv2.zip" "$tmpdir" <<'PY'
      import os
      import stat
      import sys
      import zipfile

      archive, dest = sys.argv[1:3]
      with zipfile.ZipFile(archive) as zf:
          for info in zf.infolist():
              zf.extract(info, dest)
              perm = info.external_attr >> 16
              path = os.path.join(dest, info.filename)
              if perm and os.path.exists(path) and not os.path.isdir(path):
                  os.chmod(path, perm)
      PY
      # The v2 installer refuses to run over an existing install unless --update
      # is passed, so make a reinstall/update idempotent.
      if [ -d /usr/local/aws-cli ]; then
        sudo bash "$tmpdir/aws/install" --update
      else
        sudo bash "$tmpdir/aws/install"
      fi
    remove_script: |
      set -euo pipefail
      sudo rm -rf /usr/local/aws-cli
      sudo rm -f /usr/local/bin/aws /usr/local/bin/aws_completer

  bat:
    name: bat
    description: cat replacement with syntax highlighting and git integration
    category: tools
    type: bash
    check_cmd: bat
    help_cmd: bat --help
    docs_url: https://github.com/sharkdp/bat
    # The release asset picked below is *-unknown-linux-gnu, so this needs glibc as
    # well as a /usr/local/bin to sudo it into. Alpine is excluded by the same rule.
    requires_traits:
      - glibc
      - fhs
      - sudo
    platforms:
      termux:
        requires_traits: []
        type: system
        packages: bat
        remove_script: ""
    install_script: |
      set -euo pipefail
      version="$(curl -fsSL https://api.github.com/repos/sharkdp/bat/releases/latest | python3 -c 'import json,sys; print(json.load(sys.stdin)["tag_name"].lstrip("v"))' 2>/dev/null || echo 0.24.0)"
      machine="$(uname -m)"
      if [ "$machine" = "aarch64" ]; then
        arch="aarch64"
      else
        arch="x86_64"
      fi
      filename="bat-v${version}-${arch}-unknown-linux-gnu.tar.gz"
      tmpdir="$(mktemp -d)"
      trap 'rm -rf "$tmpdir"' EXIT
      curl -fsSL -o "$tmpdir/$filename" "https://github.com/sharkdp/bat/releases/download/v${version}/${filename}"
      tar -C "$tmpdir" -xzf "$tmpdir/$filename"
      sudo mv "$tmpdir/bat-v${version}-${arch}-unknown-linux-gnu/bat" /usr/local/bin/bat
      sudo chmod +x /usr/local/bin/bat
    remove_script: |
      set -euo pipefail
      sudo rm -f /usr/local/bin/bat

  commitizen:
    name: Commitizen
    description: Conventional-commit prompt, semantic version bumping, and changelog generation
    category: tools
    type: uvx
    pip_name: commitizen
    check_cmd: cz
    help_cmd: cz --help
    docs_url: https://commitizen-tools.github.io/commitizen/
    requires:
      - uv

  docker:
    name: Docker
    description: Container runtime + docker compose plugin
    category: tools
    type: bash
    check_cmd: docker
    help_cmd: docker --help
    docs_url: https://docs.docker.com
    # get.docker.com supports glibc distributions with a package manager it knows,
    # and installs a system service. It has never supported musl (Alpine).
    requires_traits:
      - glibc
      - fhs
      - sudo
    platforms:
      termux:
        supported: false
        reason: >-
          Android's kernel does not expose the cgroup and namespace configuration the
          Docker daemon requires, and there is no Termux docker package. Running a
          Linux userland under proot-distro does not change this — proot cannot
          provide the isolation primitives either.
    install_script: |
      set -euo pipefail
      tmp="$(mktemp --suffix=.sh)"
      trap 'rm -f "$tmp"' EXIT
      curl -fsSL https://get.docker.com -o "$tmp"
      sudo sh "$tmp"
      user="${USER:-}"
      if [ -n "$user" ] && groups "$user" | grep -qv '\bdocker\b'; then
        sudo usermod -aG docker "$user"
        echo "Log out and back in for docker group membership to take effect."
      fi
      sudo systemctl enable docker 2>/dev/null || true
      sudo systemctl start docker 2>/dev/null || true
      if ! docker compose version >/dev/null 2>&1; then
        sudo apt-get install -y docker-compose-plugin 2>/dev/null \
          || sudo yum install -y docker-compose-plugin 2>/dev/null \
          || sudo dnf install -y docker-compose-plugin 2>/dev/null \
          || true
      fi
    remove_script: |
      set -euo pipefail
      sudo systemctl stop docker 2>/dev/null || true
      sudo systemctl disable docker 2>/dev/null || true
      sudo apt-get remove -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin docker-ce-rootless-extras 2>/dev/null \
        || sudo yum remove -y docker-ce docker-ce-cli containerd.io docker-compose-plugin 2>/dev/null \
        || true

  gh:
    name: GitHub CLI
    description: GitHub's official CLI - PRs, issues, Actions, and more
    category: tools
    type: bash
    check_cmd: gh
    help_cmd: gh --help
    docs_url: https://cli.github.com/manual/
    # This adds a Debian apt repository and keyring — it is not a generic installer,
    # and on Fedora/Arch it would fail after writing a sources.list.d entry.
    requires_traits:
      - apt
      - sudo
    platforms:
      termux:
        requires_traits: []
        type: system
        packages: gh
        remove_script: ""
    install_script: |
      set -euo pipefail
      curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
        | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
      sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
      echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
        | sudo tee /etc/apt/sources.list.d/github-cli.list >/dev/null
      sudo apt-get update -q
      sudo apt-get install -y gh
    remove_script: |
      set -euo pipefail
      sudo apt-get remove -y gh

  git-lfs:
    name: Git LFS
    description: Git extension for versioning large files
    category: tools
    type: bash
    check_cmd: git-lfs
    help_cmd: git lfs --help
    docs_url: https://git-lfs.com/
    # A static Go binary, so no glibc requirement — but install.sh copies it into
    # /usr/local/bin as root.
    requires_traits:
      - fhs
      - sudo
    platforms:
      termux:
        requires_traits: []
        type: system
        packages: git-lfs
        # The git filter config outlives the binary, so it still has to be undone —
        # only the "delete the file" half is replaced by the package manager.
        remove_script: |
          set -euo pipefail
          git lfs uninstall || echo "warning: 'git lfs uninstall' failed — LFS filter hooks may remain in ~/.gitconfig." >&2
          $DEVSTUFF_PKG_REMOVE git-lfs
    install_script: |
      set -euo pipefail
      version="$(curl -fsSL https://api.github.com/repos/git-lfs/git-lfs/releases/latest | python3 -c 'import json,sys; print(json.load(sys.stdin)["tag_name"].lstrip("v"))' 2>/dev/null || echo 3.5.1)"
      machine="$(uname -m)"
      if [ "$machine" = "aarch64" ]; then
        arch="arm64"
      else
        arch="amd64"
      fi
      filename="git-lfs-linux-${arch}-v${version}.tar.gz"
      tmpdir="$(mktemp -d)"
      trap 'rm -rf "$tmpdir"' EXIT
      curl -fsSL -o "$tmpdir/$filename" "https://github.com/git-lfs/git-lfs/releases/download/v${version}/${filename}"
      tar -C "$tmpdir" -xzf "$tmpdir/$filename"
      sudo bash "$tmpdir/git-lfs-${version}/install.sh"
      git lfs install
    remove_script: |
      set -euo pipefail
      if ! git lfs uninstall; then
        echo "warning: 'git lfs uninstall' failed — LFS filter hooks may remain in ~/.gitconfig." >&2
        echo "warning: run 'git lfs uninstall' manually before removing the binary, or clean up ~/.gitconfig by hand." >&2
      fi
      sudo rm -f /usr/local/bin/git-lfs

  go:
    name: Go
    description: Go programming language toolchain
    category: languages
    type: bash
    check_cmd: command -v go >/dev/null 2>&1 || test -x /usr/local/go/bin/go
    help_cmd: go help
    docs_url: https://go.dev/doc/
    # go.dev's tarballs are statically linked (they run on musl), but they unpack
    # into /usr/local as root.
    requires_traits:
      - fhs
      - sudo
    platforms:
      termux:
        requires_traits: []
        type: system
        packages: golang
        check_cmd: go
        # $PREFIX/bin is already on PATH in Termux, so there is no bashrc line to
        # add on install or strip on removal.
        remove_script: ""
    install_script: |
      set -euo pipefail
      version="$(curl -fsSL https://go.dev/dl/?mode=json | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next((r["version"].removeprefix("go") for r in data if r.get("stable")), "1.23.4"))' 2>/dev/null || echo 1.23.4)"
      machine="$(uname -m)"
      if [ "$machine" = "aarch64" ]; then
        arch="arm64"
      else
        arch="amd64"
      fi
      filename="go${version}.linux-${arch}.tar.gz"
      tmpdir="$(mktemp -d)"
      trap 'rm -rf "$tmpdir"' EXIT
      curl -fsSL -o "$tmpdir/$filename" "https://go.dev/dl/$filename"
      sudo rm -rf /usr/local/go
      sudo tar -C /usr/local -xzf "$tmpdir/$filename"
      marker="# Go"
      line='export PATH=$PATH:/usr/local/go/bin'
      touch "$HOME/.bashrc"
      if ! grep -Fxq "$marker" "$HOME/.bashrc"; then
        printf '\n%s\n%s\n' "$marker" "$line" >> "$HOME/.bashrc"
      fi
    remove_script: |
      set -euo pipefail
      sudo rm -rf /usr/local/go
      if [ -f "$HOME/.bashrc" ]; then
        python3 - "$HOME/.bashrc" <<'PY'
      import sys
      path = sys.argv[1]
      lines = open(path).read().splitlines()
      out = []
      skip = 0
      for line in lines:
          if skip:
              skip -= 1
              continue
          if line == "# Go":
              skip = 1
              continue
          out.append(line)
      open(path, "w").write("\n".join(out) + ("\n" if out else ""))
      PY
      fi

  homebrew:
    name: Homebrew
    description: Package manager for Linux (and macOS)
    category: tools
    type: bash
    check_cmd: command -v brew >/dev/null 2>&1 || test -x /home/linuxbrew/.linuxbrew/bin/brew
    help_cmd: brew --help
    docs_url: https://docs.brew.sh/Homebrew-on-Linux
    requires_traits:
      - glibc
      - apt
      - sudo
    platforms:
      termux:
        supported: false
        reason: >-
          Homebrew on Linux requires glibc and installs into /home/linuxbrew; Termux
          has neither. `pkg` is already the package manager here — `devstuff platform`
          shows what it is wired to.
    install_script: |
      set -euo pipefail
      sudo apt-get update -q
      sudo apt-get install -y build-essential bubblewrap
      NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
      marker="# Homebrew"
      line='eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"'
      touch "$HOME/.bashrc"
      if ! grep -Fxq "$marker" "$HOME/.bashrc"; then
        printf '\n%s\n%s\n' "$marker" "$line" >> "$HOME/.bashrc"
      fi
    remove_script: |
      set -euo pipefail
      NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/uninstall.sh)"
      if [ -f "$HOME/.bashrc" ]; then
        python3 - "$HOME/.bashrc" <<'PY'
      import sys
      path = sys.argv[1]
      lines = open(path).read().splitlines()
      out = []
      skip = 0
      for line in lines:
          if skip:
              skip -= 1
              continue
          if line == "# Homebrew":
              skip = 1
              continue
          out.append(line)
      open(path, "w").write("\n".join(out) + ("\n" if out else ""))
      PY
      fi

  htop:
    name: htop
    description: Interactive process and resource monitor
    category: tools
    # This entry used to be a bash script that tried apt-get, then yum, then dnf,
    # then pacman, swallowing each failure — the hand-rolled version of what the
    # `system` type now does properly. One package name, correct on every host that
    # has htop under that name (including Termux and Homebrew).
    type: system
    check_cmd: htop
    packages: htop
    help_cmd: man htop
    docs_url: https://htop.dev/

  ipython:
    name: IPython
    description: Enhanced interactive Python shell with rich tab completion and magic commands
    category: tools
    type: uvx
    pip_name: ipython
    check_cmd: ipython
    help_cmd: ipython --help
    docs_url: https://ipython.readthedocs.io/

  java:
    name: Java 21 (OpenJDK)
    description: OpenJDK 21 LTS - JDK and JRE
    category: languages
    type: system
    check_cmd: java
    # Debian/Ubuntu naming. Every other family spells it differently — see below.
    # This is the worked example of why `packages` is per-platform overridable:
    # nothing about "install OpenJDK 21" is portable except the intent.
    packages: openjdk-21-jdk
    help_cmd: java --help
    docs_url: https://openjdk.org/
    platforms:
      debian:
        # The JRE comes in as a dependency and apt-get remove leaves it behind.
        remove_script: |
          set -euo pipefail
          $DEVSTUFF_SUDO apt-get remove -y openjdk-21-jdk openjdk-21-jre
          $DEVSTUFF_SUDO apt-get autoremove -y
      fedora:
        packages: java-21-openjdk-devel
      rhel:
        packages: java-21-openjdk-devel
      arch:
        packages: jdk21-openjdk
      alpine:
        packages: openjdk21
      suse:
        packages: java-21-openjdk-devel
      termux:
        packages: openjdk-21

  lazygit:
    name: lazygit
    description: TUI git client for fast, keyboard-driven git workflows
    category: tools
    type: bash
    check_cmd: lazygit
    help_cmd: lazygit --help
    docs_url: https://github.com/jesseduffield/lazygit
    requires_traits:
      - fhs
      - sudo
    platforms:
      termux:
        requires_traits: []
        type: system
        packages: lazygit
        remove_script: ""
    install_script: |
      set -euo pipefail
      version="$(curl -fsSL https://api.github.com/repos/jesseduffield/lazygit/releases/latest | python3 -c 'import json,sys; print(json.load(sys.stdin)["tag_name"].lstrip("v"))' 2>/dev/null || echo 0.44.1)"
      machine="$(uname -m)"
      if [ "$machine" = "aarch64" ]; then
        arch="arm64"
      else
        arch="x86_64"
      fi
      filename="lazygit_${version}_Linux_${arch}.tar.gz"
      tmpdir="$(mktemp -d)"
      trap 'rm -rf "$tmpdir"' EXIT
      curl -fsSL -o "$tmpdir/$filename" "https://github.com/jesseduffield/lazygit/releases/download/v${version}/${filename}"
      tar -C "$tmpdir" -xzf "$tmpdir/$filename" lazygit
      sudo mv "$tmpdir/lazygit" /usr/local/bin/lazygit
      sudo chmod +x /usr/local/bin/lazygit
    remove_script: |
      set -euo pipefail
      sudo rm -f /usr/local/bin/lazygit

  mkcert:
    name: mkcert
    description: Zero-config local HTTPS certificates
    category: tools
    type: bash
    check_cmd: mkcert
    help_cmd: mkcert --help
    docs_url: https://github.com/FiloSottile/mkcert
    # Static Go binary, but it is curl'd straight into /usr/local/bin as root.
    # Termux has no mkcert package, so it falls out as unavailable via these traits
    # rather than needing an entry of its own.
    requires_traits:
      - fhs
      - sudo
    install_script: |
      set -euo pipefail
      version="$(curl -fsSL https://api.github.com/repos/FiloSottile/mkcert/releases/latest | python3 -c 'import json,sys; print(json.load(sys.stdin)["tag_name"].lstrip("v"))' 2>/dev/null || echo 1.4.4)"
      machine="$(uname -m)"
      if [ "$machine" = "aarch64" ]; then
        arch="arm64"
      else
        arch="amd64"
      fi
      sudo curl -fsSL -o /usr/local/bin/mkcert "https://github.com/FiloSottile/mkcert/releases/download/v${version}/mkcert-v${version}-linux-${arch}"
      sudo chmod +x /usr/local/bin/mkcert
    remove_script: |
      set -euo pipefail
      sudo rm -f /usr/local/bin/mkcert

  nerd-font:
    name: JetBrainsMono Nerd Font
    description: Patched monospace font supplying the icons Starship and other CLI tools draw
    category: customization
    type: bash
    # Files first, fontconfig second: the check has to work on a machine with no
    # fontconfig (a container), and still notice a font installed by other means.
    check_cmd: ls "$HOME/.local/share/fonts/JetBrainsMonoNerdFont"/*.ttf >/dev/null 2>&1 || fc-list 2>/dev/null | grep -qi "JetBrainsMono Nerd Font"
    help_cmd: fc-list | grep -i "nerd font"
    docs_url: https://www.nerdfonts.com/
    platforms:
      termux:
        # Termux draws the terminal itself and reads exactly one font file,
        # ~/.termux/font.ttf — there is no fontconfig directory to drop a family
        # into and no font picker. So this is the one platform where installing the
        # font *does* repoint the terminal at it, and the usual caveat is wrong.
        check_cmd: test -s "$HOME/.termux/font.ttf"
        help_cmd: echo "$HOME/.termux/font.ttf"
        install_script: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          curl -fsSL -o "$tmpdir/font.zip" \
            "https://github.com/ryanoasis/nerd-fonts/releases/latest/download/JetBrainsMono.zip"
          mkdir -p "$HOME/.termux"
          if [ -f "$HOME/.termux/font.ttf" ]; then
            cp "$HOME/.termux/font.ttf" "$HOME/.termux/font.ttf.devstuff-backup"
            echo "Existing font saved to ~/.termux/font.ttf.devstuff-backup"
          fi
          python3 - "$tmpdir/font.zip" "$HOME/.termux/font.ttf" <<'PY'
          import sys
          import zipfile

          archive, dest = sys.argv[1:3]
          want = "JetBrainsMonoNerdFont-Regular.ttf"
          with zipfile.ZipFile(archive) as zf:
              names = zf.namelist()
              pick = next((n for n in names if n.endswith(want)), None)
              if pick is None:
                  pick = next(n for n in names if n.lower().endswith(".ttf"))
              with zf.open(pick) as src, open(dest, "wb") as out:
                  out.write(src.read())
          PY
          termux-reload-settings 2>/dev/null \
            || echo "Restart Termux (or run termux-reload-settings) to pick up the new font."
        remove_script: |
          set -euo pipefail
          if [ -f "$HOME/.termux/font.ttf.devstuff-backup" ]; then
            mv "$HOME/.termux/font.ttf.devstuff-backup" "$HOME/.termux/font.ttf"
            echo "Restored the font that was in place before installation."
          else
            rm -f "$HOME/.termux/font.ttf"
          fi
          termux-reload-settings 2>/dev/null || true
    install_script: |
      set -euo pipefail
      dest="$HOME/.local/share/fonts/JetBrainsMonoNerdFont"
      tmpdir="$(mktemp -d)"
      trap 'rm -rf "$tmpdir"' EXIT
      curl -fsSL -o "$tmpdir/font.zip" \
        "https://github.com/ryanoasis/nerd-fonts/releases/latest/download/JetBrainsMono.zip"
      mkdir -p "$dest"
      # python3 rather than unzip: it is already a hard requirement of this repo, and
      # unzip is not installed on a minimal Ubuntu.
      python3 - "$tmpdir/font.zip" "$dest" <<'PY'
      import os
      import sys
      import zipfile

      archive, dest = sys.argv[1:3]
      with zipfile.ZipFile(archive) as zf:
          for info in zf.infolist():
              name = os.path.basename(info.filename)
              if name.lower().endswith((".ttf", ".otf")):
                  with zf.open(info) as src, open(os.path.join(dest, name), "wb") as out:
                      out.write(src.read())
      PY
      if command -v fc-cache >/dev/null 2>&1; then
        fc-cache -f "$dest" >/dev/null
      else
        echo "fontconfig is not installed, so the font cache was not refreshed."
        echo "The font files are in $dest."
      fi
      echo "Now select 'JetBrainsMono Nerd Font' as your terminal's font — installing it"
      echo "does not change which font your terminal is configured to use."
    remove_script: |
      set -euo pipefail
      rm -rf "$HOME/.local/share/fonts/JetBrainsMonoNerdFont"
      if command -v fc-cache >/dev/null 2>&1; then
        fc-cache -f >/dev/null || true
      fi

  nvm:
    name: NVM + Node LTS
    description: Node Version Manager + latest Node LTS
    category: core
    type: bash
    check_cmd: test -s "$HOME/.nvm/nvm.sh"
    help_cmd: nvm help
    docs_url: https://github.com/nvm-sh/nvm
    # nvm installs official Node builds, which are glibc-linked.
    requires_traits:
      - glibc
    platforms:
      termux:
        # The key stays `nvm` on purpose: it is what every npm-type tool lists in
        # `requires`, and what this entry means is "the thing that provides node and
        # npm". On Termux that is a package, and there is no version manager for it
        # (nvm's binaries would not run). generic.py's npm helpers source
        # ~/.nvm/nvm.sh with `|| true`, so npm from $PREFIX/bin is used as-is.
        requires_traits: []
        name: Node.js LTS
        description: Node.js LTS runtime and npm (Termux package; nvm cannot run here)
        type: system
        packages: nodejs-lts
        check_cmd: npm
        help_cmd: node --help
        remove_script: ""
    install_script: |
      set -euo pipefail
      tag="$(curl -fsSL https://api.github.com/repos/nvm-sh/nvm/releases/latest | python3 -c 'import json,sys; print(json.load(sys.stdin)["tag_name"])' 2>/dev/null || echo v0.40.3)"
      curl -o- "https://raw.githubusercontent.com/nvm-sh/nvm/${tag}/install.sh" | bash
      marker="# nvm"
      block='export NVM_DIR="$HOME/.nvm"
      [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
      [ -s "$NVM_DIR/bash_completion" ] && . "$NVM_DIR/bash_completion"'
      touch "$HOME/.bashrc"
      if ! grep -Fxq "$marker" "$HOME/.bashrc"; then
        printf '\n%s\n%s\n' "$marker" "$block" >> "$HOME/.bashrc"
      fi
      . "$HOME/.nvm/nvm.sh"
      nvm install --lts
    remove_script: |
      set -euo pipefail
      rm -rf "$HOME/.nvm"
      if [ -f "$HOME/.bashrc" ]; then
        python3 - "$HOME/.bashrc" <<'PY'
      import sys
      path = sys.argv[1]
      lines = open(path).read().splitlines()
      out = []
      skip = 0
      for line in lines:
          if skip:
              skip -= 1
              continue
          if line == "# nvm":
              skip = 3
              continue
          out.append(line)
      open(path, "w").write("\n".join(out) + ("\n" if out else ""))
      PY
      fi

  ollama:
    name: Ollama
    description: Run large language models locally
    category: ai-tools
    type: bash
    check_cmd: ollama
    help_cmd: ollama --help
    docs_url: https://ollama.com/docs
    requires_traits:
      - glibc
      - fhs
      - sudo
    platforms:
      termux:
        # Termux builds ollama from source (aarch64/x86_64 only — the package is
        # excluded on 32-bit arches, where the install will simply not be found).
        # There is no systemd, so nothing registers a service: start it yourself
        # with `ollama serve`.
        requires_traits: []
        type: system
        packages: ollama
        remove_script: ""
    install_script: |
      set -euo pipefail
      curl -fsSL https://ollama.com/install.sh | sh
    remove_script: |
      set -euo pipefail
      sudo systemctl stop ollama 2>/dev/null || true
      sudo systemctl disable ollama 2>/dev/null || true
      sudo rm -f /usr/local/bin/ollama /etc/systemd/system/ollama.service
      sudo systemctl daemon-reload 2>/dev/null || true
      echo "Downloaded models in ~/.ollama were left intact."

  php:
    name: PHP 8.4
    description: PHP 8.4 + common extensions via ondrej/php PPA
    category: languages
    type: bash
    check_cmd: php
    help_cmd: php --help
    docs_url: https://www.php.net/docs.php
    # An Ubuntu PPA — add-apt-repository has no meaning anywhere else.
    requires_traits:
      - apt
      - sudo
    platforms:
      termux:
        requires_traits: []
        name: PHP
        description: PHP from the Termux repositories (no PPA; whatever version is current)
        type: system
        packages: php
        remove_script: ""
    install_script: |
      set -euo pipefail
      sudo apt-get update -q
      if ! command -v add-apt-repository >/dev/null 2>&1; then
        sudo apt-get install -y software-properties-common
      fi
      sudo add-apt-repository -y ppa:ondrej/php
      sudo apt-get update -q
      sudo apt-get install -y php8.4 php8.4-cli php8.4-common php8.4-curl php8.4-mbstring php8.4-xml php8.4-zip
    remove_script: |
      set -euo pipefail
      sudo apt-get remove -y 'php8.4*'
      sudo apt-get autoremove -y

  python:
    name: Python (uv-managed)
    description: CPython provisioned by uv, installed as the default python/python3
    category: languages
    type: bash
    # Every Linux host already has a python3, so "is python3 on PATH" would report
    # this installed before it ever ran. Ask uv where its interpreters live and
    # require the default shim to resolve *inside* that directory. `test -x` rather
    # than `test -e` because a leftover shim pointing at an uninstalled version is a
    # dangling symlink — readlink still prints a matching path, but it is not usable.
    # The `test -n "$d"` guard is load-bearing: with uv absent, "$d" is empty and the
    # case pattern would collapse to "/*", which matches every absolute path.
    check_cmd: |
      bin="${UV_PYTHON_BIN_DIR:-$HOME/.local/bin}"; d="$(uv python dir 2>/dev/null)"; test -n "$d" || exit 1; case "$(readlink -f "$bin/python3" 2>/dev/null)" in "$d"/*) test -x "$bin/python3";; *) exit 1;; esac
    help_cmd: uv python list
    docs_url: https://docs.astral.sh/uv/guides/install-python/
    requires:
      - uv
    platforms:
      termux:
        # uv's managed interpreters come from python-build-standalone, which has no
        # Bionic target — `uv python install` cannot succeed here at any version. The
        # Termux package is the only CPython for this platform, which also makes the
        # uv dependency moot.
        name: Python
        description: CPython from the Termux repositories
        type: system
        packages: python
        check_cmd: python3
        help_cmd: python3 --help
        requires: []
        remove_script: ""
    install_script: |
      set -euo pipefail
      uv python install --default
      bin="${UV_PYTHON_BIN_DIR:-$HOME/.local/bin}"
      echo
      echo "'python' and 'python3' in $bin now resolve to uv's CPython."
      echo "Since uv puts $bin early on PATH, that is what your shell will pick."
      echo "The system interpreter at /usr/bin/python3 is untouched, and anything"
      echo "with an explicit /usr/bin/python3 shebang keeps using it."
    remove_script: |
      set -euo pipefail
      bin="${UV_PYTHON_BIN_DIR:-$HOME/.local/bin}"
      target="$(readlink -f "$bin/python3" 2>/dev/null || true)"
      if [ -z "$target" ] || [ ! -x "$target" ]; then
        echo "No uv-managed default python3 found in $bin — nothing to remove."
        exit 0
      fi
      # Uninstall only the version the default shim points at. `uv python uninstall
      # --all` would also take out managed interpreters that existing `uv tool`
      # environments were built against, breaking tools this command was not asked
      # to touch.
      version="$("$target" -c 'import sys; print("%d.%d.%d" % sys.version_info[:3])')"
      uv python uninstall "$version"
      echo "Removed uv-managed Python $version and its python/python3 shims."
      echo "Other uv-managed versions and /usr/bin/python3 were left alone."

  pre-commit:
    name: pre-commit
    description: Git hook manager for automated code quality checks
    category: tools
    type: uvx
    pip_name: pre-commit
    check_cmd: pre-commit
    help_cmd: pre-commit --help
    docs_url: https://pre-commit.com/
    requires:
      - uv

  pi:
    name: Pi Coding Agent
    description: AI coding agent - pi.dev
    category: ai-tools
    type: bash
    check_cmd: . "$HOME/.nvm/nvm.sh" 2>/dev/null && command -v pi >/dev/null 2>&1
    help_cmd: pi --help
    docs_url: https://pi.dev/docs/latest
    platforms:
      termux:
        # No ~/.nvm here (see the nvm entry): npm comes from the nodejs-lts package
        # and is already on PATH, so sourcing nvm.sh under `set -e` would abort the
        # script before npm ever ran.
        check_cmd: pi
        install_script: |
          set -euo pipefail
          npm install -g --ignore-scripts @earendil-works/pi-coding-agent
        remove_script: |
          set -euo pipefail
          npm uninstall -g @earendil-works/pi-coding-agent
    install_script: |
      set -euo pipefail
      . "$HOME/.nvm/nvm.sh"
      npm install -g --ignore-scripts @earendil-works/pi-coding-agent
    remove_script: |
      set -euo pipefail
      . "$HOME/.nvm/nvm.sh"
      npm uninstall -g @earendil-works/pi-coding-agent
    requires:
      - nvm

  ruby:
    name: Ruby (rbenv)
    description: Ruby via rbenv version manager + ruby-build
    category: languages
    type: bash
    check_cmd: test -x "$HOME/.rbenv/bin/rbenv"
    help_cmd: ruby --version
    docs_url: https://www.ruby-lang.org/en/documentation/
    # The build dependencies are named as Debian packages and installed with apt-get.
    requires_traits:
      - apt
      - sudo
    platforms:
      termux:
        # rbenv would have to compile CPython-style from source against Bionic;
        # Termux already ships a built Ruby, at one version rather than many.
        requires_traits: []
        name: Ruby
        description: Ruby from the Termux repositories (single version, no rbenv)
        type: system
        packages: ruby
        check_cmd: ruby
        remove_script: ""
    install_script: |
      set -euo pipefail
      sudo apt-get update -q
      sudo apt-get install -y git curl autoconf bison build-essential libssl-dev libyaml-dev libreadline-dev zlib1g-dev libncurses5-dev libffi-dev libgdbm-dev
      if [ -d "$HOME/.rbenv/.git" ]; then
        git -C "$HOME/.rbenv" pull --ff-only || true
      else
        git clone --depth=1 https://github.com/rbenv/rbenv.git "$HOME/.rbenv"
      fi
      if [ -d "$HOME/.rbenv/plugins/ruby-build/.git" ]; then
        git -C "$HOME/.rbenv/plugins/ruby-build" pull --ff-only || true
      else
        git clone --depth=1 https://github.com/rbenv/ruby-build.git "$HOME/.rbenv/plugins/ruby-build"
      fi
      marker="# rbenv"
      block='export PATH="$HOME/.rbenv/bin:$PATH"
      eval "$(rbenv init - bash)"'
      touch "$HOME/.bashrc"
      if ! grep -Fxq "$marker" "$HOME/.bashrc"; then
        printf '\n%s\n%s\n' "$marker" "$block" >> "$HOME/.bashrc"
      fi
      latest="$("$HOME/.rbenv/bin/rbenv" install -l | awk '/^[[:space:]]*[0-9]/ && $1 !~ /-/ { v=$1 } END { print v ? v : "3.3.6" }')"
      "$HOME/.rbenv/bin/rbenv" install -s "$latest"
      "$HOME/.rbenv/bin/rbenv" global "$latest"
    remove_script: |
      set -euo pipefail
      rm -rf "$HOME/.rbenv"
      if [ -f "$HOME/.bashrc" ]; then
        python3 - "$HOME/.bashrc" <<'PY'
      import sys
      path = sys.argv[1]
      lines = open(path).read().splitlines()
      out = []
      skip = 0
      for line in lines:
          if skip:
              skip -= 1
              continue
          if line == "# rbenv":
              skip = 2
              continue
          out.append(line)
      open(path, "w").write("\n".join(out) + ("\n" if out else ""))
      PY
      fi

  saml2aws:
    name: saml2aws
    description: SAML -> AWS STS credentials CLI (Versent)
    category: tools
    type: bash
    check_cmd: saml2aws
    help_cmd: saml2aws --help
    docs_url: https://github.com/Versent/saml2aws
    # Static Go binary moved into /usr/local/bin as root. No Termux package exists,
    # so the traits alone are what mark it unavailable there.
    requires_traits:
      - fhs
      - sudo
    install_script: |
      set -euo pipefail
      version="$(curl -fsSL https://api.github.com/repos/Versent/saml2aws/releases/latest | python3 -c 'import json,sys; print(json.load(sys.stdin)["tag_name"].lstrip("v"))' 2>/dev/null || echo 2.36.6)"
      machine="$(uname -m)"
      if [ "$machine" = "aarch64" ]; then
        arch="arm64"
      else
        arch="amd64"
      fi
      filename="saml2aws_${version}_linux_${arch}.tar.gz"
      tmpdir="$(mktemp -d)"
      trap 'rm -rf "$tmpdir"' EXIT
      curl -fsSL -o "$tmpdir/$filename" "https://github.com/Versent/saml2aws/releases/download/v${version}/${filename}"
      tar -C "$tmpdir" -xzf "$tmpdir/$filename"
      test -f "$tmpdir/saml2aws"
      sudo mv "$tmpdir/saml2aws" /usr/local/bin/saml2aws
      sudo chmod +x /usr/local/bin/saml2aws
    remove_script: |
      set -euo pipefail
      sudo rm -f /usr/local/bin/saml2aws

  starship:
    name: Starship
    description: Fast, cross-shell customizable prompt
    category: customization
    type: bash
    check_cmd: starship
    help_cmd: starship --help
    docs_url: https://starship.rs/guide/
    # starship's install.sh picks a musl asset where appropriate, so no glibc
    # requirement — but it sudo-installs into /usr/local/bin.
    requires_traits:
      - fhs
      - sudo
    platforms:
      termux:
        requires_traits: []
        type: system
        packages: starship
        # Not `remove_script: ""`: unlike the other package swaps, starship leaves a
        # line in ~/.bashrc, and dropping the binary without it would leave every new
        # shell evaluating a command that no longer exists. So the removal is
        # spelled out here — the package manager half plus the same bashrc cleanup.
        remove_script: |
          set -euo pipefail
          $DEVSTUFF_PKG_REMOVE starship
          if [ -f "$HOME/.bashrc" ]; then
            python3 - "$HOME/.bashrc" <<'PY'
          import sys
          path = sys.argv[1]
          lines = open(path).read().splitlines()
          out = []
          skip = 0
          for line in lines:
              if skip:
                  skip -= 1
                  continue
              if line == "# Starship prompt":
                  skip = 1
                  continue
              out.append(line)
          open(path, "w").write("\n".join(out) + ("\n" if out else ""))
          PY
          fi
    install_script: |
      set -euo pipefail
      curl -fsSL https://starship.rs/install.sh | sh -s -- --yes
      marker="# Starship prompt"
      line='eval "$(starship init bash)"'
      touch "$HOME/.bashrc"
      if ! grep -Fxq "$marker" "$HOME/.bashrc"; then
        printf '\n%s\n%s\n' "$marker" "$line" >> "$HOME/.bashrc"
      fi
    remove_script: |
      set -euo pipefail
      rm -f "$HOME/.cargo/bin/starship" "$HOME/.local/bin/starship"
      sudo rm -f /usr/local/bin/starship 2>/dev/null || true
      if [ -f "$HOME/.bashrc" ]; then
        python3 - "$HOME/.bashrc" <<'PY'
      import sys
      path = sys.argv[1]
      lines = open(path).read().splitlines()
      out = []
      skip = 0
      for line in lines:
          if skip:
              skip -= 1
              continue
          if line == "# Starship prompt":
              skip = 1
              continue
          out.append(line)
      open(path, "w").write("\n".join(out) + ("\n" if out else ""))
      PY
      fi

  uv:
    name: uv
    description: Astral Python package and project manager
    category: core
    type: bash
    check_cmd: command -v uv >/dev/null 2>&1 && command -v uvx >/dev/null 2>&1 || { test -x "$HOME/.local/bin/uv" && test -x "$HOME/.local/bin/uvx"; }
    help_cmd: uv --help
    docs_url: https://docs.astral.sh/uv/
    platforms:
      termux:
        # astral.sh/uv/install.sh serves linux-gnu and linux-musl builds; neither
        # links against Bionic. Termux builds uv from source instead, shipping both
        # uv and uvx into $PREFIX/bin, which the base check_cmd already finds.
        type: system
        packages: uv
        remove_script: ""
    install_script: |
      set -euo pipefail
      curl -LsSf https://astral.sh/uv/install.sh | sh
      marker="# uv (and other ~/.local/bin tools)"
      line='export PATH="$HOME/.local/bin:$PATH"'
      touch "$HOME/.bashrc"
      if ! grep -Fxq "$marker" "$HOME/.bashrc"; then
        printf '\n%s\n%s\n' "$marker" "$line" >> "$HOME/.bashrc"
      fi
    remove_script: |
      set -euo pipefail
      rm -f "$HOME/.local/bin/uv" "$HOME/.local/bin/uvx" "$HOME/.cargo/bin/uv" "$HOME/.cargo/bin/uvx"

  llm-checker:
    name: llm-checker
    description: Tool to check llm compatibility with hardware
    category: ai-tools
    type: npm
    npm_name: llm-checker
    # Multi-word on purpose: a "complex" check_cmd is what makes get_version() fall
    # through to the nvm-sourcing probe, which is the only way to read the version of
    # an nvm-installed binary. `hw-detect` also answered "is it installed", but did a
    # full hardware scan (shelling out to lspci) on every `devstuff list` to do it.
    check_cmd: llm-checker --version
    help_cmd: llm-checker --help
    docs_url: https://github.com/signerless/llm-checker
    requires:
      - nvm

  lmstudio:
    name: LM Studio
    description: Run large language models locally with a GUI
    category: ai-tools
    type: bash
    check_cmd: command -v lms >/dev/null 2>&1 || test -x "$HOME/.lmstudio/bin/lms"
    help_cmd: lms --help
    docs_url: https://lmstudio.ai/docs/cli
    requires_traits:
      - glibc
      - apt
      - sudo
    platforms:
      termux:
        supported: false
        reason: >-
          LM Studio is distributed as a glibc desktop application for x86_64 and
          arm64 Linux; there is no Android build.
        alternative: ollama
    install_script: |
      set -euo pipefail
      # LM Studio's installer hard-fails on a system without libatomic: it prints the
      # apt line to run and exits 1 rather than installing it. That is the state of a
      # minimal Ubuntu (including this repo's CI image), so install it here — every
      # other prerequisite the installer needs is already present on a base system.
      if ! ldconfig -p 2>/dev/null | grep -q 'libatomic\.so'; then
        sudo apt-get update -q
        sudo apt-get install -y libatomic1
      fi
      curl -fsSL https://lmstudio.ai/install.sh | bash
    remove_script: |
      set -euo pipefail
      rm -rf "$HOME/.lmstudio"
      if [ -f "$HOME/.bashrc" ]; then
        sed -i '/lmstudio/d' "$HOME/.bashrc"
      fi

  yq:
    name: yq
    description: Portable command-line YAML/JSON/XML processor
    category: tools
    type: bash
    check_cmd: yq
    help_cmd: yq --help
    docs_url: https://mikefarah.gitbook.io/yq
    requires_traits:
      - fhs
      - sudo
    platforms:
      termux:
        requires_traits: []
        type: system
        packages: yq
        remove_script: ""
    install_script: |
      set -euo pipefail
      version="$(curl -fsSL https://api.github.com/repos/mikefarah/yq/releases/latest | python3 -c 'import json,sys; print(json.load(sys.stdin)["tag_name"])' 2>/dev/null || echo v4.44.3)"
      machine="$(uname -m)"
      if [ "$machine" = "aarch64" ]; then
        arch="arm64"
      else
        arch="amd64"
      fi
      curl -fsSL -o /tmp/yq "https://github.com/mikefarah/yq/releases/download/${version}/yq_linux_${arch}"
      sudo mv /tmp/yq /usr/local/bin/yq
      sudo chmod +x /usr/local/bin/yq
    remove_script: |
      set -euo pipefail
      sudo rm -f /usr/local/bin/yq
